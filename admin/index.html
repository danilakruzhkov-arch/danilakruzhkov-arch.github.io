<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Проекты</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --blue:#0066cc; --line:#e5e5ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --card:#232326; --ink:#f5f5f7; --muted:#a1a1a6; --blue:#2997ff; --line:#3a3a3d; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 24px; }
  .card { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:12px; text-decoration:none; color:inherit; }
  .card:active { opacity:.8; }
  .card .t { font-size:18px; font-weight:600; margin-bottom:4px; }
  .card .d { color:var(--muted); font-size:14px; line-height:1.4; }
  .card .tag { display:inline-block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--blue); font-weight:600; margin-bottom:6px; }
  .gate { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  input { width:100%; font-size:17px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); }
  button { margin-top:10px; width:100%; font-size:17px; padding:12px; border:0; border-radius:12px; background:var(--blue); color:#fff; font-weight:600; }
  .err { color:#d33; font-size:14px; margin-top:8px; min-height:18px; }
  .foot { color:var(--muted); font-size:12px; margin-top:32px; }
</style>
<script src="config.js"></script>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <h1>Проекты</h1>
  <p class="sub">Рабочие инструменты. Раздел закрытый, ссылок с сайта нет.</p>
  <div id="gate" class="gate" hidden>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
    <button id="go">Войти</button>
    <div id="err" class="err"></div>
  </div>
  <div id="list" hidden>
    <a class="card" href="projects/budget/">
      <div class="tag">Финансы</div>
      <div class="t">Планер бюджета</div>
      <div class="d">Балансы по счетам, платежи с горизонтом, долги, прогноз остатка и сколько нужно занять.</div>
    </a>
    <div class="foot"><a href="#" id="logout" style="color:var(--muted)">Выйти</a></div>
  </div>
</div>
<script>
(async function(){
  const C=window.ADMIN_CFG;
  const gate=document.getElementById('gate'), list=document.getElementById('list'), err=document.getElementById('err');
  async function sha(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  async function check(key){
    try{
      const r=await fetch(C.url+'/rest/v1/budget_state?id=eq.1&select=version',{headers:{apikey:C.key,'x-budget-key':key}});
      if(!r.ok) return false; const j=await r.json(); return Array.isArray(j)&&j.length===1;
    }catch(e){ return false; }
  }
  let key=null; try{ key=localStorage.getItem('admin_key'); }catch(e){}
  if(key && await check(key)){ list.hidden=false; } else { gate.hidden=false; }
  document.getElementById('go').onclick=async()=>{
    err.textContent='';
    const k=await sha(document.getElementById('pw').value.trim());
    if(await check(k)){ try{ localStorage.setItem('admin_key',k);}catch(e){} gate.hidden=true; list.hidden=false; }
    else err.textContent='Не подходит (или база ещё не настроена).';
  };
  document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('go').click(); });
  document.getElementById('logout').onclick=(e)=>{ e.preventDefault(); try{ localStorage.removeItem('admin_key'); }catch(x){} location.reload(); };
})();
</script>
</body>
</html>
