<!doctype html>
<html lang="ru">
<head>

<title>Планер бюджета</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --blue:#0066cc; --line:#e5e5ea; --green:#1e8e3e; --red:#d93025; --amber:#b06000; --chip:#eef0f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --card:#232326; --ink:#f5f5f7; --muted:#a1a1a6; --blue:#2997ff; --line:#3a3a3d; --green:#4cd964; --red:#ff6b6b; --amber:#ffb340; --chip:#2e2e32; } }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif; font-size:15px; }
  a { color:var(--blue); text-decoration:none; }
  .top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
  .top .bar { display:flex; align-items:center; gap:10px; padding:10px 16px 6px; }
  .top h1 { font-size:18px; margin:0; flex:1; letter-spacing:-.3px; }
  .status { font-size:12px; color:var(--muted); }
  .status.err { color:var(--red); }
  .tabs { display:flex; gap:4px; overflow-x:auto; padding:0 12px 8px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; padding:7px 12px; border-radius:999px; background:transparent; color:var(--muted); border:0; font-size:14px; font-weight:500; }
  .tab.on { background:var(--ink); color:var(--bg); }
  .wrap { max-width:960px; margin:0 auto; padding:14px 16px 80px; } .wrap.wide { max-width:1500px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .kpi .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .kpi .v { font-size:22px; font-weight:700; letter-spacing:-.5px; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kpi .s { font-size:12px; color:var(--muted); margin-top:2px; }
  .pos { color:var(--green); } .neg { color:var(--red); } .warn { color:var(--amber); }
  h2 { font-size:16px; margin:18px 0 8px; }
  h2:first-child { margin-top:0; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  th.sortable { cursor:pointer; user-select:none; white-space:nowrap; } th.sortable.on { color:var(--ink); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.dim td { color:var(--muted); }
  tr.click { cursor:pointer; }
  .tscroll { overflow-x:auto; margin:0 -16px; padding:0 16px; }
  .chip { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .chip.ok { background:rgba(30,142,62,.15); color:var(--green); }
  .chip.bad { background:rgba(217,48,37,.15); color:var(--red); }
  .chip.amb { background:rgba(176,96,0,.15); color:var(--amber); }
  .chip.blue { background:rgba(0,102,204,.12); color:var(--blue); }
  button, .btn { font:inherit; font-size:14px; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.pri { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
  button.sm { font-size:12px; padding:4px 10px; border-radius:8px; }
  button.danger { color:var(--red); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row.between { justify-content:space-between; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  input, select, textarea { font:inherit; font-size:15px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); width:100%; }
  input[type=number] { text-align:right; font-variant-numeric:tabular-nums; }
  input.inline { width:130px; padding:6px 8px; font-size:14px; }
  input.inline.wide { width:200px; } input.inline.num { width:110px; } input.inline.date { width:140px; } input.inline.pos { color:var(--green); } input.inline.blue { color:var(--blue); }
  select.inline { width:auto; padding:6px 8px; font-size:13px; } select.inline.sm { max-width:130px; }
  button.ico { padding:4px 7px; font-size:12px; margin-left:2px; } button.ico.danger { color:var(--red); } input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; } input[type=number] { -moz-appearance:textfield; appearance:textfield; } button.ico.mand { font-size:14px; color:var(--muted); } button.ico.mand.on { color:var(--ink); }
  table.pay { width:100%; } table.pay td { padding:5px 4px; } table.pay tr.grp td { padding:8px 6px; border-top:2px solid var(--line); } table.pay td.grow { width:40%; } table.pay td.grow input { width:100%; min-width:140px; } table.pay tr.done { opacity:.45; }
  select.st-skipped { color:var(--red); } select.st-confirmed { color:var(--green); } tr.bold td { font-weight:700; } td.hot { font-weight:600; } td.dimc { opacity:.45; font-weight:400; } table.sum td:first-child { white-space:nowrap; } .blue { color:var(--blue); }
  label.f { display:block; margin-bottom:10px; }
  label.f span { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .f2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet { background:var(--card); width:100%; max-width:560px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px 28px; }
  @media (min-width:640px) { .modal { align-items:center; } .sheet { border-radius:18px; } }
  .sheet h3 { margin:0 0 12px; font-size:17px; }
  .gate { max-width:420px; margin:80px auto; }
  .empty { color:var(--muted); padding:16px 0; text-align:center; }
  canvas { max-height:260px; }
  .seg { display:flex; gap:4px; background:var(--chip); padding:3px; border-radius:10px; }
  .seg button { border:0; background:transparent; padding:6px 10px; font-size:13px; color:var(--muted); }
  .seg button.on { background:var(--card); color:var(--ink); font-weight:600; }

  .occ { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .occ .nm { flex:1; min-width:0; } .occ .nm .sub { font-size:12px; color:var(--muted); }
  .occ .amt { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; }
  .occ .acts { display:flex; gap:4px; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4; }

<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const C=window.ADMIN_CFG;
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(v!==null&&v!==undefined) e.setAttribute(k,v);} for(const k of kids.flat()){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); } return e; };
const todayISO=()=>{ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const parse=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays=(s,n)=>{ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths=(s,n)=>{ const d=parse(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const ld=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,ld)); return iso(d); };
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const mkey=s=>s.slice(0,7);
const MONTHS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const fmtD=s=>{ const d=parse(s); return d.getDate()+' '+MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); };
const fmtM=s=>{ const [y,m]=s.split('-'); return MONTHS[+m-1]+' '+y; };
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
let disp='RUB'; try{ disp=localStorage.getItem('budget_disp')||'RUB'; }catch(e){}
const D=v=>disp==='USD'?v/(rate('USD')||1):v;
const rub=v=>disp==='USD'?nf.format(Math.round(D(v)))+' $':nf.format(Math.round(v))+' ₽';
const sym=()=>disp==='USD'?'$':'₽';
const UNIT={IDR:1000,LAK:1000}; const unit=c=>UNIT[c]||1; const curLabel=c=>c+(UNIT[c]?' тыс.':''); // IDR и LAK хранятся и вводятся в тысячах, как в таблице
const money=(v,cur)=>(cur==='RUB'?nf.format(Math.round(v))+' ₽':nf2.format(v)+' '+curLabel(cur));
const sign=v=>(v>0?'+':'')+nf.format(Math.round(v));
const rid=p=>p+Math.random().toString(36).slice(2,8);
const uniq=a=>[...new Set(a)];
const CURS=['RUB','USD','USDT','EUR','AED','IDR','TRY','GEL','LAK','CNY','THB'];
const ATYPES={debit:'дебетовый',credit:'кредитка',cash:'наличные',savings:'накопительный',crypto:'крипта',loan:'кредит',other:'прочее'};
const SCOPES={personal:'Личное',clippoint:'ClipPoint'};
const HZ={now:'сейчас',month:'месяц',someday:'когда-нибудь'};

// ---------- storage ----------
const store={ state:null, version:null, key:null, status:'', timer:null, saving:false, local:new URLSearchParams(location.search).has('local') };
async function sha(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const H=()=>({apikey:C.key,'x-budget-key':store.key,'Content-Type':'application/json'});
async function load(){
  if(store.local){ let raw=null; try{ raw=localStorage.getItem('budget_local'); }catch(e){} store.state=normalize(raw?JSON.parse(raw):{}); store.version=0; return true; }
  const r=await fetch(C.url+'/rest/v1/budget_state?id=eq.1&select=data,version',{headers:H()});
  if(!r.ok) throw new Error('http '+r.status);
  const j=await r.json(); if(!j.length) throw new Error('nokey');
  store.state=normalize(j[0].data); store.version=j[0].version; return true;
}
function normalize(s){
  s=s||{}; s.settings=s.settings||{base:'RUB',rates:{RUB:1,USD:84},forecastMonths:6}; s.settings.rates=s.settings.rates||{RUB:1};
  for(const k of ['categories','accounts','snapshots','payments','debts','goals']) s[k]=s[k]||[];
  s.postings=s.postings||{}; return s;
}
function setStatus(t,err){ store.status=t; const e=$('#status'); if(e){ e.textContent=t; e.className='status'+(err?' err':''); } }
function touch(){ setStatus('изменено…'); try{ localStorage.setItem('budget_cache',JSON.stringify(store.state)); }catch(e){} clearTimeout(store.timer); store.timer=setTimeout(save,1200); }
async function save(){
  if(store.saving){ clearTimeout(store.timer); store.timer=setTimeout(save,800); return; }
  store.saving=true; setStatus('сохраняю…');
  if(store.local){ try{ localStorage.setItem('budget_local',JSON.stringify(store.state)); setStatus('локально сохранено'); }catch(e){ setStatus('localStorage недоступен',true); } store.saving=false; return; }
  try{
    const r=await fetch(C.url+'/rest/v1/budget_state?id=eq.1&version=eq.'+store.version,{method:'PATCH',headers:{...H(),Prefer:'return=representation'},body:JSON.stringify({data:store.state})});
    const j=r.ok?await r.json():[];
    if(j.length){ store.version=j[0].version; setStatus('сохранено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})); }
    else { setStatus('конфликт версий, перезагрузи страницу',true); }
  }catch(e){ setStatus('нет связи, не сохранено',true); }
  store.saving=false;
}

// ---------- engine ----------
const S=()=>store.state;
function rate(cur){ return S().settings.rates[cur]||(cur==='USDT'?S().settings.rates.USD:0)||0; }
const toB=(v,cur)=>v*unit(cur)*rate(cur);
const catName=id=>(S().categories.find(c=>c.id===id)||{}).name||'—';
const accById=id=>S().accounts.find(a=>a.id===id);
function schedText(p){ const s=p.schedule||{}; if(s.type==='once') return s.date?'разово '+fmtD(s.date):'когда-нибудь'; if(s.type==='weekly') return s.start?'еженедельно с '+fmtD(s.start)+(s.end?' по '+fmtD(s.end):''):'еженедельно, когда-нибудь'; if(s.type==='biweekly') return 'раз в 2 недели с '+fmtD(s.start); return (s.day===31?'последний день':s.day+'-го')+' ежемесячно'+(s.start?' с '+fmtD(s.start):'')+(s.end?' по '+fmtD(s.end):''); }
function monthlyEq(p){ const s=p.schedule||{}; const v=toB(p.amount,p.currency); if(s.type==='monthly') return v/(s.every||1); if(s.type==='weekly') return v*52/12; if(s.type==='biweekly') return v*26/12; return 0; }
function expand(sched,from,to){ // dates in [from,to]
  const out=[]; if(!sched) return out;
  if(sched.type==='once'){ if(sched.date&&sched.date>=from&&sched.date<=to) out.push(sched.date); return out; }
  if(sched.type==='weekly'||sched.type==='biweekly'){ if(!sched.start) return out; const step=sched.type==='weekly'?7:14; let d=sched.start; while(d<=to){ if(d>=from&&(!sched.end||d<=sched.end)) out.push(d); d=addDays(d,step); if(sched.end&&d>sched.end) break; } return out; }
  // monthly
  if(!sched.start) return out; // регулярный без даты старта = когда-нибудь
  const start=sched.start; let [y,m]=start.split('-').map(Number); const ev=sched.every||1;
  for(let i=0;i<400;i++){ const dd=Math.min(sched.day||1,lastDay(y,m)); const d=y+'-'+String(m).padStart(2,'0')+'-'+String(dd).padStart(2,'0'); if(d>to) break; if(d>=from&&d>=start&&(!sched.end||d<=sched.end)) out.push(d); m+=ev; while(m>12){ m-=12; y++; } }
  return out;
}
function debtRemaining(d,upto){ // остаток долга на дату: сумма минус платежи по долгу (строки Платежей с debtId) после asOf и до upto, кроме отменённых и пропущенных
  const pays=S().payments.filter(p=>p.debtId===d.id&&p.active!==false); let rem=d.amount; const from=addDays(d.asOf||'2000-01-01',1); const k=unit(d.currency)*rate(d.currency)||1;
  for(const p of pays){ for(const dt of expand(p.schedule,from,upto)){ const st=postStatus(p.id,dt); if(st==='cancelled'||st==='skipped') continue; const post=S().postings[p.id+'|'+dt]||{}; const amt=post.amount!=null?post.amount:p.amount; rem-=toB(amt,p.currency)/k; } }
  return Math.max(0,rem);
}
function postStatus(id,date){ const p=S().postings[id+'|'+date]; if(p) return p.status; return date<=todayISO()?'auto':'planned'; }
function occurrences(from,to){
  const out=[];
  for(const p of S().payments){ if(p.active===false) continue;
    let remP=null; if(p.debtId){ const d=S().debts.find(x=>x.id===p.debtId); if(d){ remP=debtRemaining(d,addDays(from,-1))*unit(d.currency)*rate(d.currency)/(unit(p.currency)*rate(p.currency)||1); } } // платёж по долгу не больше остатка
    for(const dt of expand(p.schedule,from,to)){ const post=S().postings[p.id+'|'+dt]||{}; let amt=post.amount!=null?post.amount:p.amount; const st=postStatus(p.id,dt);
      if(remP!=null){ if(remP<=0.005) break; amt=Math.min(amt,remP); if(st!=='cancelled'&&st!=='skipped') remP-=amt; }
      out.push({key:p.id+'|'+dt,id:p.id,date:dt,name:p.name,kind:p.kind,scope:p.scope,category:p.category,amount:amt,currency:p.currency,rub:toB(amt,p.currency),status:st,mandatory:p.mandatory,src:'payment'}); } }
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.kind==='income'?-1:1)); return out;
}
const signed=o=>(o.kind==='income'?1:-1)*o.rub;
function hangOld(upto){ // «висит» с датой по upto включительно: снимок их не закрывает, обязательство остаётся до оплаты или отмены
  const out=[]; for(const [k,post] of Object.entries(S().postings)){ if(post.status!=='skipped') continue; const [id,dt]=k.split('|'); if(dt>upto) continue; const p=S().payments.find(x=>x.id===id); if(!p||p.active===false) continue; const amt=post.amount!=null?post.amount:p.amount;
    out.push({key:k,id,date:dt,name:p.name,kind:p.kind,scope:p.scope,category:p.category,amount:amt,currency:p.currency,rub:toB(amt,p.currency),status:'skipped',mandatory:p.mandatory,src:'payment',old:true}); }
  return out.sort((a,b)=>a.date<b.date?-1:1); }
function confirmOld(p,date){ // оплата висящего с датой до снимка: разовая строка переезжает на сегодня, чтобы вычесться из остатка после снимка
  if(date<=lastSnapDate()&&(p.schedule||{}).type==='once'){ delete S().postings[p.id+'|'+date]; p.schedule.date=todayISO(); S().postings[p.id+'|'+p.schedule.date]={status:'confirmed'}; return true; } return false; }
function snapTotal(sn){ let t=0; for(const [aid,v] of Object.entries(sn.balances||{})){ const a=accById(aid); if(a&&v!=null&&!isDebtAcc(a)) t+=toB(v,a.currency); } return t; } // деньги без кредитов
function snapDebt(sn){ let t=0; for(const [aid,v] of Object.entries(sn.balances||{})){ const a=accById(aid); if(a&&v!=null&&isDebtAcc(a)&&v<0) t+=toB(-v,a.currency); } return t; } // долг по кредитам и кредиткам, положительное число
function compute(){
  const today=todayISO(); const snaps=[...S().snapshots].sort((a,b)=>a.date<b.date?-1:1);
  const last=snaps.filter(s=>s.date<=today).pop()||snaps[snaps.length-1]||null;
  const cashAtSnap=last?snapTotal(last):0;
  const months=S().settings.forecastMonths||6; const horizonEnd=addMonths(today,months);
  const occ=occurrences(last?addDays(last.date,1):today,horizonEnd);
  const old=last?hangOld(last.date):[]; let posted=0, arrears=0; const due=[...old]; for(const o of old) arrears+=o.rub;
  for(const o of occ){ if(o.date<=today){ if(o.status==='auto'||o.status==='confirmed') posted+=signed(o); else if(o.status==='skipped'){ arrears+=o.rub; due.push(o);} } }
  const cashNow=cashAtSnap+posted;
  // forecast by day
  const future=occ.filter(o=>o.date>today&&o.status!=='cancelled');
  let bal=cashNow-arrears; const series=[{date:today,bal}]; let min={bal,date:today};
  const byDay={}; for(const o of future){ byDay[o.date]=(byDay[o.date]||0)+signed(o); }
  for(let d=addDays(today,1); d<=horizonEnd; d=addDays(d,1)){ if(byDay[d]){ bal+=byDay[d]; if(bal<min.bal) min={bal,date:d}; } series.push({date:d,bal}); }
  // months table
  const mt={}; for(const o of occ){ if(o.status==='cancelled') continue; const k=mkey(o.date); mt[k]=mt[k]||{inc:0,exp:0,end:0}; if(o.kind==='income') mt[k].inc+=o.rub; else mt[k].exp+=o.rub; }
  let run=cashAtSnap; for(const k of Object.keys(mt).sort()){ run+=mt[k].inc-mt[k].exp; mt[k].end=run; }
  const nextInc=future.find(o=>o.kind==='income'); let free=cashNow-arrears; for(const o of future){ if(nextInc&&o.date>=nextInc.date) break; if(o.kind==='expense') free-=o.rub; }
  const debts=S().debts.filter(d=>d.dir!=='owed').map(d=>({...d,remaining:debtRemaining(d,today),remRub:toB(debtRemaining(d,today),d.currency)})); // «мне должны» в итоги не входят
  const debtTotal=debts.reduce((s,d)=>s+d.remRub,0); const credDebt=last?snapDebt(last):0;
  return {today,last,cashAtSnap,cashNow,posted,arrears,due,hangOld:old,series,min,borrow:Math.max(0,-min.bal),months:mt,nextInc,free,debts,debtTotal,credDebt,net:cashNow-debtTotal-credDebt,occ,future};
}
function otherSpend(){ // между снимками: ожидалось − факт
  const snaps=[...S().snapshots].sort((a,b)=>a.date<b.date?-1:1); const out=[];
